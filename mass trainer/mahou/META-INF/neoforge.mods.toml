modLoader="javafml" #mandatory
license="All Rights Reserved"
loaderVersion="[1,)" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory
# The modid of the mod
modId="mahoutsukai" #mandatory
# The version number of the mod - there's a few well known null variables useable here or just hardcode it
version="1.21.1-v1.36.29"
# A display name for the mod
displayName="Mahou Tsukai" #mandatory
# A text field displayed in the mod UI
authors="stepsword" #optional
# The description text for the mod (multi line!) (#mandatory)
description='''
A magic mod inspired loosely by Fate/stay night and other media.
'''
enumExtensions="META-INF/enumextensions.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

